<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koumara Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,800;1,7..72,400&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the phone on the left as the working prototype, a side panel with the screen map, notes and demo controls. */
:root {
  --paper: #F4F6F2; --surface: #FFFFFF; --sunk: #E9EDE7; --ink: #16201A; --muted: #56635B; --rule: #D5DCD4;
  --vip: #A8231B; --action: #9A5800; --news: #2C6648; --buy: #844628; --screen: #4F5672;
  --vip-wash: #F7E3E0; --action-wash: #F6EAD6; --news-wash: #DFEDE4; --buy-wash: #F1E4DC; --screen-wash: #E3E5EE;
  --glass: rgba(246, 248, 244, .92); --mag: #FBFAF6; --scrim: rgba(10, 20, 14, .34);
  --pub-sb: #24506A; --pub-sm: #6A3A5E; --pub-fn: #7A5A12; --pub-cb: #2F5D3A;
  --page-ink: #16201A; --page-muted: #56635B; --page-rule: #D5DCD4; --page-surface: #FFFFFF;
  --display: "Literata", "Iowan Old Style", Georgia, serif;
  --serif: "New York", "Literata", "Iowan Old Style", Georgia, serif;
  --body: "Public Sans", "Helvetica Neue", Helvetica, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1310; --surface: #141C17; --sunk: #1B241E; --ink: #E5EBE6; --muted: #9AA8A0; --rule: #27322B;
    --vip: #FF7B6E; --action: #F0AC45; --news: #74C99C; --buy: #D9946D; --screen: #A9B0D4;
    --vip-wash: #3A1A17; --action-wash: #36280F; --news-wash: #15301F; --buy-wash: #33211A; --screen-wash: #20243A;
    --glass: rgba(22, 30, 25, .94); --mag: #121814; --scrim: rgba(0, 0, 0, .5);
    --pub-sb: #8DBBD6; --pub-sm: #D3A4C6; --pub-fn: #DDB761; --pub-cb: #8CC79A;
    --page-ink: #E5EBE6; --page-muted: #9AA8A0; --page-rule: #27322B; --page-surface: #141C17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1310; --surface: #141C17; --sunk: #1B241E; --ink: #E5EBE6; --muted: #9AA8A0; --rule: #27322B;
  --vip: #FF7B6E; --action: #F0AC45; --news: #74C99C; --buy: #D9946D; --screen: #A9B0D4;
  --vip-wash: #3A1A17; --action-wash: #36280F; --news-wash: #15301F; --buy-wash: #33211A; --screen-wash: #20243A;
  --glass: rgba(22, 30, 25, .94); --mag: #121814; --scrim: rgba(0, 0, 0, .5);
  --pub-sb: #8DBBD6; --pub-sm: #D3A4C6; --pub-fn: #DDB761; --pub-cb: #8CC79A;
  --page-ink: #E5EBE6; --page-muted: #9AA8A0; --page-rule: #27322B; --page-surface: #141C17;
  color-scheme: dark;
}
/* Phone appearance switch, independent of the page theme */
.ph-light {
  --paper: #F4F6F2; --surface: #FFFFFF; --sunk: #E9EDE7; --ink: #16201A; --muted: #56635B; --rule: #D5DCD4;
  --vip: #A8231B; --action: #9A5800; --news: #2C6648; --buy: #844628; --screen: #4F5672;
  --vip-wash: #F7E3E0; --action-wash: #F6EAD6; --news-wash: #DFEDE4; --buy-wash: #F1E4DC; --screen-wash: #E3E5EE;
  --glass: rgba(246, 248, 244, .92); --mag: #FBFAF6; --scrim: rgba(10, 20, 14, .34);
  --pub-sb: #24506A; --pub-sm: #6A3A5E; --pub-fn: #7A5A12; --pub-cb: #2F5D3A;
  color-scheme: light;
}
.ph-dark {
  --paper: #0D1310; --surface: #141C17; --sunk: #1B241E; --ink: #E5EBE6; --muted: #9AA8A0; --rule: #27322B;
  --vip: #FF7B6E; --action: #F0AC45; --news: #74C99C; --buy: #D9946D; --screen: #A9B0D4;
  --vip-wash: #3A1A17; --action-wash: #36280F; --news-wash: #15301F; --buy-wash: #33211A; --screen-wash: #20243A;
  --glass: rgba(22, 30, 25, .94); --mag: #121814; --scrim: rgba(0, 0, 0, .5);
  --pub-sb: #8DBBD6; --pub-sm: #D3A4C6; --pub-fn: #DDB761; --pub-cb: #8CC79A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--page-ink); font: 16px/1.55 var(--body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
.top { max-width: 72rem; margin: 0 auto; padding-block: 36px 22px; display: grid; gap: 8px; }
.top h1 { font: 600 clamp(2rem, 6vw, 3rem)/1.05 var(--display); margin: 0; }
.top h1 span { color: var(--vip); }
.top p { margin: 0; max-width: 46rem; color: var(--page-muted); }
.top .eyebrow { font: 500 .72rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--page-muted); }
.stage { max-width: 72rem; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 40px; align-items: start; }
@media (max-width: 820px) { .stage { grid-template-columns: 1fr; justify-items: center; gap: 28px; } }

/* ---------- Side panel ---------- */
.panel { display: grid; gap: 22px; min-width: 0; width: 100%; }
.panel h2 { font: 600 1.15rem/1.2 var(--display); margin: 0; }
.panel .card { border: 1px solid var(--page-rule); background: var(--page-surface); padding: 16px 18px; display: grid; gap: 10px; }
.note-title { font: 600 1.3rem/1.2 var(--display); margin: 0; }
.note-body { color: var(--page-muted); font-size: .95rem; display: grid; gap: 8px; }
.note-body p { margin: 0; }
.map { display: grid; gap: 14px; }
.map .grp { display: grid; gap: 6px; }
.map .grp > span { font: 500 .68rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--page-muted); }
.map .links { display: flex; flex-wrap: wrap; gap: 6px; }
.map button, .ctl button { all: unset; box-sizing: border-box; cursor: pointer; font: 500 .84rem/1 var(--body); padding: 7px 10px; border: 1px solid var(--page-rule); border-radius: 7px; color: var(--page-ink); }
.map button:hover, .ctl button:hover { background: var(--sunk); }
.map button[aria-current="true"] { background: var(--page-ink); color: var(--paper); border-color: var(--page-ink); }
.map button:focus-visible, .ctl button:focus-visible { outline: 2px solid var(--vip); outline-offset: 2px; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Phone ---------- */
.phone { width: 360px; height: 760px; border: 9px solid #1A1F1C; border-radius: 52px; background: var(--surface); color: var(--ink); position: relative; overflow: hidden; overflow: clip; font: 14px/1.4 var(--ui); box-shadow: 0 30px 70px -36px rgba(10, 30, 20, .55); }
.island { position: absolute; top: 9px; left: 50%; width: 96px; height: 26px; margin-left: -48px; background: #1A1F1C; border-radius: 14px; z-index: 40; }
.sbar { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 6px 26px 0 30px; font-size: 13px; font-weight: 600; z-index: 30; pointer-events: none; }
.vp { position: absolute; inset: 0; overflow: hidden; }
.scr { position: absolute; inset: 0; background: var(--surface); display: flex; flex-direction: column; }
.scr.mag { background: var(--mag); }
.scr:not(.raw)::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 44px; background: var(--surface); z-index: 5; pointer-events: none; }
.scr.mag:not(.raw)::before { background: var(--mag); }
.topbar { position: absolute; top: 44px; left: 0; right: 0; height: 3px; background: var(--rule); z-index: 6; }
.topbar i { display: block; height: 100%; width: 0; background: var(--ink); }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding-top: 44px; padding-bottom: 96px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.no-tabs .scroll { padding-bottom: 30px; }
@media (prefers-reduced-motion: no-preference) {
  .scr.in-push { animation: inPush .32s cubic-bezier(.2, .8, .2, 1) both; }
  .scr.in-pop { animation: inPop .28s cubic-bezier(.2, .8, .2, 1) both; }
  .scr.in-fade { animation: inFade .2s ease-out both; }
  @keyframes inPush { from { transform: translateX(100%); box-shadow: -10px 0 30px rgba(0,0,0,.15); } to { transform: none; } }
  @keyframes inPop { from { transform: translateX(-28%); opacity: .6; } to { transform: none; opacity: 1; } }
  @keyframes inFade { from { opacity: .3; } to { opacity: 1; } }
}
button { font: inherit; color: inherit; }
.b { all: unset; box-sizing: border-box; cursor: pointer; }
.b:focus-visible, .phone [tabindex]:focus-visible, .phone input:focus-visible, .phone textarea:focus-visible { outline: 2px solid var(--vip); outline-offset: 2px; border-radius: 6px; }
.nav { display: flex; align-items: center; justify-content: space-between; padding: 4px 14px 2px; min-height: 36px; color: var(--news); font-size: 15px; }
.nav .l, .nav .r { display: flex; gap: 16px; align-items: center; }
.nav .b { color: var(--news); padding: 4px 2px; min-height: 30px; display: inline-flex; align-items: center; gap: 2px; }
.nav .ttl { font-weight: 600; color: var(--ink); font-size: 15px; }
.lt { font: 700 32px/1.1 var(--ui); padding: 2px 16px 0; letter-spacing: -.01em; margin: 0; }
.sub { padding: 2px 16px 10px; color: var(--muted); font-size: 13px; }
.sect { padding: 14px 16px 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; align-items: baseline; }
.sect .b { color: var(--news); text-transform: none; letter-spacing: 0; font-size: 13px; }
.glyph { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font: 600 11.5px/1 var(--ui); flex: none; }
.g-vip { color: var(--vip); background: var(--vip-wash); } .g-action { color: var(--action); background: var(--action-wash); }
.g-news { color: var(--news); background: var(--news-wash); } .g-buy { color: var(--buy); background: var(--buy-wash); }
.g-screen { color: var(--screen); background: var(--screen-wash); } .g-plain { color: var(--muted); background: var(--sunk); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.c-vip { background: var(--vip-wash); color: var(--vip); } .c-action { background: var(--action-wash); color: var(--action); }
.c-news { background: var(--news-wash); color: var(--news); } .c-buy { background: var(--buy-wash); color: var(--buy); }
.c-screen { background: var(--screen-wash); color: var(--screen); } .c-plain { background: var(--sunk); color: var(--muted); }

/* Rows */
.row { display: grid; grid-template-columns: 38px 1fr; gap: 11px; padding: 11px 16px; border-bottom: 1px solid var(--rule); background: var(--surface); text-align: left; width: 100%; }
.row.nav-row { cursor: pointer; }
.row .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; background: var(--sunk); color: var(--muted); }
.row .av.vip { background: var(--vip-wash); color: var(--vip); }
.row .main { display: grid; gap: 2px; min-width: 0; }
.row .t1 { display: flex; gap: 6px; align-items: baseline; }
.row .t1 b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; font-weight: 600; }
.row .t1 span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .s1 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s2 { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
.row.plain { grid-template-columns: 1fr auto; align-items: center; }
.row.plain .chev { color: var(--muted); }
.row.glyphrow { grid-template-columns: 26px 1fr auto; align-items: center; }
.tile { margin: 0 16px 10px; border-radius: 16px; background: var(--paper); padding: 12px 14px; display: grid; gap: 8px; text-align: left; width: calc(100% - 32px); }
.tile .hd { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.tile .hd .r { margin-left: auto; font-weight: 500; font-size: 12.5px; color: var(--muted); }
.tile > * { min-width: 0; max-width: 100%; }
.tile .ln { display: flex; gap: 8px; align-items: baseline; font-size: 14px; width: 100%; text-align: left; cursor: pointer; padding: 2px 0; }
.tile .ln span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .ln .m { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tile.mini-ed { background: var(--mag); border: 1px solid var(--rule); }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--rule); display: grid; place-items: center; color: transparent; font-size: 13px; font-weight: 700; flex: none; }
.check.done { background: var(--action); border-color: var(--action); color: var(--surface); }
.check.dashed { border-style: dashed; }
.trow { display: grid; grid-template-columns: 30px 1fr; gap: 8px; padding: 11px 16px; border-bottom: 1px solid var(--rule); align-items: start; background: var(--surface); }
.trow.doneanim .ttext b { text-decoration: line-through; color: var(--muted); }
.trow .ttext { display: grid; gap: 2px; text-align: left; min-width: 0; }
.trow .ttext b { font-size: 15px; font-weight: 600; }
.trow .due { font-size: 12.5px; font-weight: 600; color: var(--action); white-space: nowrap; }
.trow .src { font-size: 13px; color: var(--muted); }
.quote-s { font-size: 12.5px; border-left: 2px solid var(--action); padding-left: 8px; color: var(--muted); margin-top: 2px; }
.collapse { transition: max-height .35s ease, opacity .3s; max-height: 200px; overflow: hidden; }
.collapse.gone { max-height: 0; opacity: 0; }

/* Tab bar */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; border-top: 1px solid var(--rule); background: var(--glass); backdrop-filter: blur(12px); display: grid; grid-template-columns: repeat(5, 1fr); padding-top: 7px; z-index: 20; }
.tabbar .b { display: grid; justify-items: center; align-content: start; gap: 3px; font-size: 10.5px; color: var(--muted); position: relative; }
.tabbar .b[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.tabbar .glyph { width: 26px; height: 26px; font-size: 12.5px; }
.tabbar .badge { position: absolute; top: -3px; left: 50%; margin-left: 7px; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--vip); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }

/* Buttons and fields */
.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 6px; padding: 11px 14px; border-radius: 12px; font: 600 15px/1 var(--ui); background: var(--sunk); color: var(--ink); text-align: center; }
.btn.pri { background: var(--ink); color: var(--surface); }
.btn.red { background: var(--vip); color: #fff; }
.btn.sm { padding: 7px 10px; font-size: 12.5px; border-radius: 9px; }
.btn.full { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--vip); outline-offset: 2px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.field { display: grid; gap: 4px; padding: 0 16px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field textarea { font: 15px/1.4 var(--ui); color: var(--ink); background: var(--sunk); border: 0; border-radius: 10px; padding: 10px 12px; width: 100%; }
.field textarea { min-height: 170px; resize: none; font-family: var(--ui); }
.searchbox { margin: 0 16px 10px; display: flex; gap: 8px; align-items: center; background: var(--sunk); border-radius: 11px; padding: 8px 11px; color: var(--muted); font-size: 15px; width: calc(100% - 32px); }
.searchbox input { all: unset; flex: 1; color: var(--ink); font: 15px/1.2 var(--ui); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: 10px; padding: 2px; margin: 0 16px 10px; }
.seg .b { text-align: center; padding: 6px; border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
.seg .b[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.toggle { width: 46px; height: 28px; border-radius: 14px; background: var(--rule); position: relative; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s; }
.toggle[aria-checked="true"] { background: var(--news); }
.toggle[aria-checked="true"]::after { left: 20px; }
.toggle.vipt[aria-checked="true"] { background: var(--vip); }
.group { margin: 0 16px 14px; border-radius: 14px; background: var(--paper); overflow: hidden; }
.group .gi { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--rule); min-height: 46px; text-align: left; width: 100%; }
.group .gi:last-child { border-bottom: 0; }
.group .gi .tx { flex: 1; min-width: 0; display: grid; gap: 1px; }
.group .gi .tx span { font-size: 12.5px; color: var(--muted); }
.group .gi .val { color: var(--muted); font-size: 14px; white-space: nowrap; }
.foot { padding: 0 30px 14px; font-size: 12.5px; color: var(--muted); margin-top: -6px; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper .b { width: 30px; height: 28px; border-radius: 8px; background: var(--surface); display: grid; place-items: center; font-weight: 600; }
.stepper output { min-width: 54px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--news); display: inline-block; margin-right: 6px; }

/* Thread */
.msg { padding: 12px 16px; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
.msg .from { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }
.msg .from b { color: var(--ink); font-size: 15px; }
.msg p { margin: 0; font-size: 15px; line-height: 1.5; }
.why { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; margin: 0 16px 6px; font-size: 12.5px; color: var(--muted); }
.why u { color: var(--news); text-decoration: none; font-weight: 600; }
.draft { margin: 12px 16px; border: 1.5px solid var(--vip); border-radius: 16px; padding: 12px 14px; display: grid; gap: 10px; }
.draft .lab { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--vip); }
.draft .txt { font-size: 15px; line-height: 1.5; }
@media (prefers-reduced-motion: no-preference) { .draft .txt.swap { animation: inFade .35s ease-out both; } }
.task-card { margin: 12px 16px; border-radius: 16px; background: var(--action-wash); padding: 12px 14px; display: grid; gap: 8px; }
.task-card .lab { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--action); }
.task-card b { font-size: 16px; }
.promise { margin: 12px 16px; border: 1px solid var(--rule); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; background: var(--surface); }
.sentmsg { background: var(--paper); }

/* Sheets, toasts, banner */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 50; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--surface); border-radius: 20px 20px 0 0; padding: 10px 0 30px; display: grid; gap: 12px; box-shadow: 0 -16px 40px -14px rgba(0,0,0,.45); max-height: 92%; overflow-y: auto; }
.sheet.tall { top: 50px; max-height: none; border-radius: 16px 16px 0 0; align-content: start; }
.sheet::before { content: ""; width: 38px; height: 5px; border-radius: 3px; background: var(--rule); justify-self: center; }
.sheet .sh-head { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; }
.sheet .sh-head h2 { margin: 0; font: 600 16px/1.2 var(--ui); }
.sheet .pad { padding: 0 16px; display: grid; gap: 10px; }
.sheet .txt { font: 400 15px/1.55 var(--serif); border: 1px solid var(--rule); border-radius: 12px; padding: 11px 13px; background: var(--paper); }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: sheetUp .34s cubic-bezier(.2, .9, .3, 1.04) both; }
  .scrim { animation: inFade .25s ease-out both; }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
}

    if (String(id).indexOf("task:") === 0) {
      var t = task(id.slice(5));
      return '<div class="tile" style="margin:0;width:100%"><b>Decided by the on-device model</b><span style="font-family:var(--mono);font-size:12px;line-height:1.6">✓ Asks you to do something<br>✓ Deadline found: ' + esc(t.due) + '<br>· Confidence: high</span></div><span style="font-size:13.5px;color:var(--muted)">The sentence it used:</span><span class="quote-s" style="color:var(--ink)">“' + esc(t.quote || t.body) + '”</span>' +
        '<button class="btn full" data-a="toast" data-msg="Moved. Koumara will ask about this sender once.">Move to another lane</button>';
    }
    var v = VIPS[id];
    return '<div class="tile" style="margin:0;width:100%"><b>Decided by a header rule</b><span style="font-family:var(--mono);font-size:12px;line-height:1.6">✓ Sender is on your VIP list<br>· On-device model: not needed</span></div><span style="font-size:13.5px;color:var(--muted)">' + esc(first(v.name)) + ' was added to VIPs during setup. Change nudge times in Settings.</span>' +
      '<button class="btn full" data-a="goSettingsVip">VIPs and nudges</button>';
  }

  function updatePanel(key) {
    var n = NOTES[key] || NOTES[key === "shelf" ? "reading" : "today"];
    if (key === "shelf") n = ["Shelf", "Publications as rows with unread counts. Open one to see its issues, mute it, or unsubscribe in one tap."];
    document.getElementById("noteTitle").textContent = n[0];
    document.getElementById("noteBody").innerHTML = "<p>" + esc(n[1]) + "</p>";
    Array.prototype.forEach.call(document.querySelectorAll("#map button"), function (b) { b.setAttribute("aria-current", String(b.dataset.k === key)); });
  }
  function buildMap() {
    document.getElementById("map").innerHTML = MAP.map(function (g) {
      return '<div class="grp"><span>' + g[0] + '</span><div class="links">' + g[1].map(function (x) { return '<button type="button" data-k="' + x[0] + '">' + x[1] + '</button>'; }).join("") + '</div></div>';
    }).join("");
  }

  /* ---------------- Navigation ---------------- */
  function go(s, p, anim) { if (s === "ob-sorting") startSorting(); stack().push({ s: s, p: p || {} }); focusNext = true; render(anim === undefined ? "push" : anim); }
  function back() { var st = stack(); if (st.length > 1) { st.pop(); focusNext = true; render("pop"); } }
  function replaceTop(s, p) { var st = stack(); st[st.length - 1] = { s: s, p: p || {} }; focusNext = true; render("fade"); var sc = vp.querySelector(".scroll"); if (sc) sc.scrollTop = 0; }
  function tab(t) {
    if (!S.onboarded) return;
    if (S.tab === t) { S.stacks[t] = [S.stacks[t][0]]; } else S.tab = t;
    focusNext = true; render("fade");
  }
  function finishOb() { S.onboarded = true; S.tab = "today"; S.stacks.today = [{ s: "today" }]; focusNext = true; render("fade"); }
  function ensureOnboarded() { if (!S.onboarded) { S.acct.gmail = true; S.acct.icloud = true; S.sortPct = 100; S.onboarded = true; } }

  function jump(k) {
    S.sheet = null;
    if (k.indexOf("ob-") === 0) {
      S.onboarded = false; S.ob = [{ s: "ob-welcome" }];
      if (k === "ob-sorting") startSorting();
      if (k !== "ob-welcome") S.ob.push({ s: k });
      focusNext = true; render("fade"); return;
    }
    ensureOnboarded();
    var m = {
      today: ["today"], vip: ["vip"], thread: ["vip", "thread", { id: S.waiting[0] || "dana" }], action: ["action"], task: ["action", "task", { id: "lease" }], screener: ["today", "screener"],
      reading: ["reading"], shelf: ["reading"], contents: ["reading", "contents"], article: ["reading", "article", { id: "p1" }], brief: ["reading", "brief"], pub: ["reading", "pub", { id: "sm" }],
      purchases: ["purchases"], order: ["purchases", "order", { id: "fs" }], "order-emails": ["purchases", "order-emails", { id: "fs" }], psearch: ["purchases", "psearch"], year: ["purchases", "year"],
      search: ["today", "search"], settings: ["today", "settings"], "set-accounts": ["today", "set-accounts"], "set-vips": ["today", "set-vips"], "set-reading": ["today", "set-reading"], "set-ai": ["today", "set-ai"], "set-rules": ["today", "set-rules"], "set-notifs": ["today", "set-notifs"], "set-default": ["today", "set-default"],
      "sheet-compose": ["today"], "sheet-why": ["vip", "thread", { id: S.waiting[0] || "dana" }], "sheet-review": ["vip"]
    }[k];
    if (!m) return;
    S.tab = m[0];
    S.readMode = k === "shelf" ? "shelf" : (m[0] === "reading" ? "edition" : S.readMode);
    S.stacks[m[0]] = [{ s: m[0] }];
    if (k.indexOf("set-") === 0) S.stacks.today.push({ s: "settings" });
    if (m[1]) S.stacks[m[0]].push({ s: m[1], p: m[2] || {} });
    if (k === "sheet-compose") S.sheet = { type: "compose", fresh: true };
    if (k === "sheet-why") S.sheet = { type: "why", id: S.waiting[0] || "dana", fresh: true };
    if (k === "sheet-review") { if (!S.waiting.length) S.waiting = ["dana", "mom"]; S.sheet = { type: "review", id: S.waiting[0], fresh: true }; }
    focusNext = !S.sheet; render("fade");
  }

  var sortTimer = null;
  function startSorting() {
    clearInterval(sortTimer);
    S.sortPct = REDUCED ? 100 : 0;
    if (REDUCED) return;
    sortTimer = setInterval(function () {
      S.sortPct = Math.min(100, S.sortPct + 4);
      if (S.onboarded || cur().s !== "ob-sorting") { clearInterval(sortTimer); S.sortPct = 100; return; }
      var p = S.sortPct;
      Array.prototype.forEach.call(vp.querySelectorAll(".meter i[data-w]"), function (i) { i.style.width = Math.round(+i.dataset.w * p / 100) + "%"; });
      Array.prototype.forEach.call(vp.querySelectorAll(".meter .n[data-n]"), function (n) { n.textContent = Math.round(+n.dataset.n * p / 100).toLocaleString(); });
      var line = document.getElementById("sortLine"); if (line) line.textContent = Math.round(4212 * p / 100).toLocaleString() + " of 4,212 · on this iPhone";
      var m = vp.querySelector(".meter"); if (m) m.setAttribute("aria-label", "Sorting progress, " + p + " percent");
      if (S.sortPct >= 100) { clearInterval(sortTimer); say("Sorting finished."); }
    }, 120);
  }

  /* ---------------- Toasts ---------------- */
  var toastT = null;
  function toast(msg, undo) { clearTimeout(toastT); S.toast = { msg: msg, undo: undo || null }; renderOverlay(); say(msg); toastT = setTimeout(function () { S.toast = null; renderOverlay(); }, 4500); }

  /* ---------------- VIP sending ---------------- */
  function sendVip(id, viaSwipe) {
    var v = VIPS[id];
    var text = v.drafts[S.tone[id] || "base"];
    var t1, t2;
    function commit() {
      S.waiting = S.waiting.filter(function (w) { return w !== id; });
      S.replied.unshift({ id: id, name: v.name, init: v.init, subj: v.subj, note: "✓ Replied just now" });
      S.sent[id] = text;
      S.stamping = null;
      if (v.promise) S.promiseAsk = id;
      render();
      if (!S.waiting.length) say("Everyone's heard back.");
    }
    if (viaSwipe) {
      S.stamping = id; render();
      t1 = setTimeout(function () { var r = vp.querySelector('.srow[data-id="' + id + '"]'); if (r) r.classList.add("gone"); }, 900);
      t2 = setTimeout(commit, 1260);
    } else commit();
    toast("Sent to " + first(v.name), function () {
      clearTimeout(t1); clearTimeout(t2);
      S.stamping = null;
      S.replied = S.replied.filter(function (r) { return r.id !== id; });
      delete S.sent[id];
      if (S.promiseAsk === id) S.promiseAsk = null;
      if (S.waiting.indexOf(id) < 0) S.waiting.unshift(id);
      render(); say("Send undone. Draft kept.");
    });
  }

  /* ---------------- Swipe ---------------- */
  var CIRC = 106.8;
  function bindSwipes() {
    Array.prototype.forEach.call(vp.querySelectorAll(".srow"), function (rowEl) {
      var cell = rowEl.querySelector(".row");
      var lead = rowEl.querySelector(".under.lead"), trail = rowEl.querySelector(".under.trail");
      var seal = rowEl.querySelector(".seal"), prog = rowEl.querySelector(".prog"), lab = rowEl.querySelector(".lab"), core = rowEl.querySelector(".core"), peek = rowEl.querySelector(".peek");
      var chips = rowEl.querySelectorAll(".dial span");
      var id = rowEl.dataset.id;
      var sx = 0, sy = 0, active = false, dragging = false, armed = false, detent = -1;
      function setX(x) {
        cell.style.transform = "translateX(" + x + "px)";
        lead.style.visibility = x > 0 ? "visible" : "hidden";
        trail.style.visibility = x < 0 ? "visible" : "hidden";
        if (x > 0) {
          var T = rowEl.clientWidth * 0.6, f = Math.min(x / T, 1);
          prog.style.strokeDashoffset = String(CIRC * (1 - f));
          peek.style.width = Math.max(x - 70, 0) + "px";
          var a = x >= T;
          if (a !== armed) { armed = a; seal.classList.toggle("armed", a); core.textContent = a ? "➤" : "◆"; lab.textContent = a ? "Let go to read & send" : "Your draft"; }
        } else {
          var d = x <= -190 ? 2 : x <= -130 ? 1 : x <= -70 ? 0 : -1;
          if (d !== detent) { detent = d; Array.prototype.forEach.call(chips, function (c, i) { c.classList.toggle("on", i === d); }); }
        }
      }
      cell.addEventListener("pointerdown", function (e) { if (e.button > 0) return; active = true; dragging = false; sx = e.clientX; sy = e.clientY; });
      cell.addEventListener("pointermove", function (e) {
        if (!active) return;
        var mx = e.clientX - sx, my = e.clientY - sy;
        if (!dragging) {
          if (Math.abs(mx) < 6 || Math.abs(mx) < Math.abs(my)) return;
          dragging = true; rowEl.classList.add("dragging");
          try { cell.setPointerCapture(e.pointerId); } catch (err) {}
        }
        var lim = 250;
        setX(Math.abs(mx) > lim ? Math.sign(mx) * (lim + (Math.abs(mx) - lim) * 0.2) : mx);
      });
      function end() {
        if (!active) return;
        active = false; rowEl.classList.remove("dragging");
        if (!dragging) return;
        cell.dataset.dragged = "1";
        var wasArmed = armed, d = detent;
        setX(0); armed = false; detent = -1;
        seal.classList.remove("armed"); core.textContent = "◆"; lab.textContent = "Your draft";
        Array.prototype.forEach.call(chips, function (c) { c.classList.remove("on"); });
        if (wasArmed) { S.sheet = { type: "review", id: id, fresh: true }; renderOverlay(); updatePanel("sheet-review"); }
        else if (d >= 0) laterVip(id, ["in 1 hour", "Tonight, 6 PM", "Tomorrow, 8 AM"][d]);
      }
      cell.addEventListener("pointerup", end);
      cell.addEventListener("pointercancel", end);
    });
  }
  function laterVip(id, when) {
    var r = vp.querySelector('.srow[data-id="' + id + '"]');
    if (r) r.classList.add("gone");
    var t = setTimeout(function () { S.waiting = S.waiting.filter(function (w) { return w !== id; }); S.later.push({ id: id, when: when }); render(); }, 360);
    toast(first(VIPS[id].name) + " → " + when, function () { clearTimeout(t); S.later = S.later.filter(function (l) { return l.id !== id; }); if (S.waiting.indexOf(id) < 0) S.waiting.push(id); render(); });
  }

  function bindProgress() {
    var sc = vp.querySelector(".scroll"), bar = document.getElementById("progBar");
    if (!sc || !bar) return;
    function upd() { var max = sc.scrollHeight - sc.clientHeight; bar.style.width = (max > 0 ? Math.min(100, sc.scrollTop / max * 100) : 100) + "%"; }
    sc.addEventListener("scroll", upd, { passive: true }); upd();
  }

  /* ---------------- Actions ---------------- */
  var A = {
    go: function (d) { if (d.t && S.onboarded && d.t !== S.tab) { S.tab = d.t; S.stacks[d.t] = [{ s: d.t }]; } go(d.s, d.id ? { id: d.id } : {}); },
    back: back,
    replace: function (d) { replaceTop(d.s, d.id ? { id: d.id } : {}); },
    tab: function (d) { tab(d.t); },
    gmailOk: function () { S.acct.gmail = true; if (S.onboarded) { back(); toast("Gmail connected"); return; } stack().pop(); go("ob-icloud", {}, "fade"); },
    icloudOk: function () {
      var pw = document.getElementById("icpw");
      if (pw && pw.value.replace(/\W/g, "").length < 4) { toast("Paste the app-specific password first"); pw.focus(); return; }
      S.acct.icloud = true; go("ob-vips");
    },
    pick: function (d) { var i = +d.i; S.picks[i] = !S.picks[i]; render(); },
    obGroup: function (d) { S.obGroups[d.k] = true; render(); toast(d.k === "news" ? "52 newsletters let into Reading" : "19 stores let into Purchases"); },
    openSettingsSys: function () { toast("In the app, this opens iOS Settings"); },
    finishOb: function () { if (!S.acct.gmail && !S.acct.icloud) S.acct.gmail = true; finishOb(); },
    compose: function (d) {
      if (d.id) { var v = VIPS[d.id]; S.sheet = { type: "compose", reply: true, id: d.id, to: v.name, subj: "Re: " + v.subj, body: v.drafts[S.tone[d.id] || "base"], from: v.acct, fresh: true }; }
      else S.sheet = { type: "compose", to: d.to || "", subj: d.subj || "", body: d.body || "", from: "Gmail", fresh: true };
      renderOverlay(); updatePanel("sheet-compose");
    },
    from: function (d) { readCompose(); S.sheet.from = d.f; renderOverlay(); },
    sendCompose: function () {
      readCompose();
      var sh = S.sheet;
      if (!sh.to.trim()) { toast("Add someone to send to"); var t = document.getElementById("cTo"); if (t) t.focus(); return; }
      if (sh.reply && sh.id && S.waiting.indexOf(sh.id) > -1) { sendVipText(sh.id, sh.body); return; }
      S.sheet = null; render(); toast("Sent from " + (sh.from || "Gmail"), function () { toast("Send undone. Message saved to Drafts."); });
    },
    closeSheet: function () { S.sheet = null; render(); var f = vp.querySelector("[data-focus]"); if (f) f.focus({ preventScroll: true }); },
    tone: function (d) { S.tone[d.id] = (S.tone[d.id] === d.tone ? "base" : d.tone); render(); var t = document.getElementById("draftTxt"); if (t) t.classList.add("swap"); say("Draft rewritten, " + (S.tone[d.id] === "base" ? "original" : d.tone)); },
    sendVip: function (d) { sendVip(d.id, false); },
    sendFromSheet: function (d) { S.sheet = null; renderOverlay(); var onVip = cur().s === "vip"; sendVip(d.id, onVip); },
    editFromSheet: function (d) { A.compose({ id: d.id }); },
    addPromise: function (d) {
      var v = VIPS[d.id];
      S.tasks.unshift({ id: "pr-" + d.id, title: v.promise.title, due: v.promise.due, grp: v.promise.due === "Today" ? "today" : "week", src: "From your reply · ◆ VIP", from: v.name, subj: v.subj, quote: v.promise.quote, body: S.sent[d.id] });
      S.promiseAsk = null; render(); toast("Added to Action");
    },
    noPromise: function () { S.promiseAsk = null; render(); },
    why: function (d) { S.sheet = { type: "why", id: d.id, fresh: true }; renderOverlay(); updatePanel("sheet-why"); },
    goSettingsVip: function () { S.sheet = null; S.tab = "today"; S.stacks.today = [{ s: "today" }, { s: "settings" }]; go("set-vips"); },
    taskDone: function (d) {
      var t = task(d.id);
      if (t.done) return;
      t.done = true;
      var goBack = !!d.back;
      if (goBack) back(); else render();
      var r = vp.querySelector('.trow[data-id="' + d.id + '"]');
      if (r) { r.classList.add("doneanim"); setTimeout(function () { r.classList.add("gone"); }, 350); }
      var tm = setTimeout(function () { t.gone = true; render(); }, 720);
      toast("Done: " + t.title, function () { clearTimeout(tm); t.done = false; t.gone = false; render(); });
    },
    snoozeTask: function (d) { var t = task(d.id); t.due = "Tomorrow"; t.grp = "week"; back(); toast(t.title + " → tomorrow"); },
    readMode: function (d) { S.readMode = d.m; render("fade"); },
    gist: function (d) { S.gistOpen[d.id] = !S.gistOpen[d.id]; render(); },
    listen: function () { toast("Reading aloud. Continues to the next piece."); },
    save: function () { toast("Saved for later"); },
    mute: function (d) { S.muted[d.id] = !S.muted[d.id]; render(); toast(S.muted[d.id] ? "Muted for 2 weeks" : "Unmuted"); },
    unsub: function (d) { S.unsub[d.id] = true; render(); toast("Unsubscribed. No web page needed.", function () { S.unsub[d.id] = false; render(); }); },
    pFilter: function (d) { S.pFilter = d.f; render(); },
    pq: function (d) { S.psearch = d.q; S.pchips = d.q.indexOf("Arbor") > -1 ? ["Merchant: Arbor Books", "2026"] : []; render(); say("Results updated"); },
    rmChip: function (d) { S.pchips.splice(+d.i, 1); if (!S.pchips.length) { S.psearch = ""; } render(); },
    gq: function (d) { S.query = d.q; render(); },
    track: function (d) { S.tracking[d.id] = !S.tracking[d.id]; render(); toast(S.tracking[d.id] ? "Tracking on your Lock Screen" : "Stopped tracking"); },
    biz: function (d) { S.business[d.id] = !S.business[d.id]; render(); },
    screen: function (d) {
      var c = S.screener.filter(function (x) { return x.id === d.id; })[0];
      var el = vp.querySelector('.tile[data-id="' + d.id + '"]');
      if (el) el.classList.add("gone");
      var tm = setTimeout(function () { S.screener = S.screener.filter(function (x) { return x.id !== d.id; }); render(); }, 360);
      toast(d.yes ? c.name + ": " + c.yes.toLowerCase() : c.name + " won't reach you again", function () { clearTimeout(tm); if (!S.screener.some(function (x) { return x.id === c.id; })) S.screener.push(c); render(); });
    },
    nudge: function (d) { S.nudges[d.id] = Math.max(5, Math.min(240, S.nudges[d.id] + (+d.d))); render(); },
    edAm: function () { S.edition.am = !S.edition.am; render(); },
    edPm: function () { S.edition.pm = !S.edition.pm; render(); },
    img: function (d) { S.images[d.id] = !S.images[d.id]; render(); },
    aiAway: function () { S.ai.away = !S.ai.away; render(); },
    nVip: function () { S.notif.vip = !S.notif.vip; render(); },
    nRet: function () { S.notif.ret = !S.notif.ret; render(); },
    nEd: function () { S.notif.ed = !S.notif.ed; render(); },
    acctOn: function (d) { S.acct[d.k] = true; render(); toast(d.k === "icloud" ? "iCloud Mail added" : "Account added"); },
    toast: function (d) { toast(d.msg); },
    undo: function () { var u = S.toast && S.toast.undo; clearTimeout(toastT); S.toast = null; renderOverlay(); if (u) u(); },
    openBanner: function () {
      var id = S.banner; S.banner = null; clearTimeout(bannerT);
      S.tab = "vip"; S.stacks.vip = [{ s: "vip" }]; go("thread", { id: id });
    }
  };
  function sendVipText(id, body) {
    S.sheet = null;
    VIPS[id].drafts.custom = body;
    S.tone[id] = "custom";
    sendVip(id, false);
  }
  function readCompose() {
    if (!S.sheet || S.sheet.type !== "compose") return;
    var to = document.getElementById("cTo"), su = document.getElementById("cSubj"), bo = document.getElementById("cBody");
    if (to) S.sheet.to = to.value; if (su) S.sheet.subj = su.value; if (bo) S.sheet.body = bo.value;
  }

  /* ---------------- Events ---------------- */
  phone.addEventListener("click", function (e) {
    var el = e.target.closest("[data-a]");
    if (!el || !phone.contains(el)) return;
    if (el.dataset.dragged) { delete el.dataset.dragged; return; }
    var fn = A[el.dataset.a];
    if (fn) { e.preventDefault(); fn(el.dataset); }
  });
  phone.addEventListener("keydown", function (e) {
    var el = e.target;
    if ((e.key === "Enter" || e.key === " ") && el.getAttribute && el.getAttribute("role") === "button" && el.dataset.a) { e.preventDefault(); A[el.dataset.a](el.dataset); }
    if (e.key === "Escape" && S.sheet) A.closeSheet();
  });
  phone.addEventListener("submit", function (e) {
    var f = e.target.dataset.form;
    if (!f) return;
    e.preventDefault();
    if (f === "psearch") { var v = document.getElementById("pq").value; S.psearch = v; S.pchips = /arbor/i.test(v) ? ["Merchant: Arbor Books"].concat(/year|2026/i.test(v) ? ["2026"] : []) : []; }
    if (f === "search") S.query = document.getElementById("gq").value;
    render(); say("Results updated");
  });
  phone.addEventListener("input", function (e) {
    if (e.target.id === "gq") { S.query = e.target.value; var pos = e.target.selectionStart; render(); var n = document.getElementById("gq"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
    if (e.target.id === "cBody" || e.target.id === "cTo" || e.target.id === "cSubj") readCompose();
  });

  var bannerT = null;
  document.getElementById("ctlVip").addEventListener("click", function () {
    ensureOnboarded();
    if (S.waiting.indexOf("dana2") < 0) S.waiting.unshift("dana2");
    S.banner = "dana2";
    render();
    clearTimeout(bannerT);
    bannerT = setTimeout(function () { S.banner = null; renderOverlay(); }, 7000);
  });
  document.getElementById("ctlTheme").addEventListener("click", function (e) {
    var dark = phone.classList.toggle("ph-dark");
    phone.classList.toggle("ph-light", !dark);
    e.currentTarget.textContent = dark ? "Phone: light" : "Phone: dark";
  });
  document.getElementById("ctlReset").addEventListener("click", function () { S = fresh(); delete VIPS.dana.drafts.custom; delete VIPS.mom.drafts.custom; delete VIPS.dana2.drafts.custom; clearTimeout(bannerT); focusNext = false; render("fade"); });
  document.getElementById("map").addEventListener("click", function (e) { var b = e.target.closest("button[data-k]"); if (b) jump(b.dataset.k); });

  S = fresh();
  buildMap();
  render();
})();
</script>
